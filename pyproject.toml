[project]
name = "sundial"
version = "0.1.0"
description = "Reflective astrology app — chart engines, corpus retrieval, reflection synthesis"
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.8",
    "flatlib>=0.2.3",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sundial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
